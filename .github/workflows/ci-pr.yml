name: CI Pull Request

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Static syntax check
        run: |
          python -m py_compile account-model.py utxo-model.py

      - name: Run tests
        run: |
          pytest -q
