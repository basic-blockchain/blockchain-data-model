name: CI Main Branch

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Archive project snapshot
        run: |
          tar -czf blockchain-data-model.tar.gz account-model.py utxo-model.py domain tests pytest.ini

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-data-model-snapshot
          path: blockchain-data-model.tar.gz
